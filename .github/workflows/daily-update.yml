name: 渔业文献每日更新

on:
  schedule:
    # 每天 08:00 UTC 运行（北京时间 16:00）
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/daily-update.yml"

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install deps
        run: pip install -r requirements.txt

      - name: 🔍 抓取最新论文
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CI: "true"
        run: python scripts/fetch_papers.py

      - name: 📥 回捞缺失摘要
        run: python scripts/fetch_abstracts.py
        continue-on-error: true

      - name: 🤖 DeepSeek 中文摘要
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/summarize.py
        continue-on-error: true

      - name: 🏷️ 自动打标签
        run: python scripts/tag_papers.py --force

      - name: 🧹 清理无关论文
        # 判为与渔业无关的论文从数据集移除，DOI 记入 data/offtopic.json，后续抓取自动跳过
        run: python scripts/prune_offtopic.py

      - name: 🧠 预计算论文向量
        # 没配 EMBED_API_KEY 时脚本会直接退出，continue-on-error 保证流水线不中断
        env:
          EMBED_API_KEY: ${{ secrets.EMBED_API_KEY }}
          EMBED_API_BASE: ${{ vars.EMBED_API_BASE }}
          EMBED_MODEL: ${{ vars.EMBED_MODEL }}
        run: python scripts/build_embeddings.py
        continue-on-error: true

      - name: 🔗 计算论文关联
        run: python scripts/build_relations.py --force

      - name: 🎨 生成站点
        env:
          # 未设置时站点自动退回纯 BM25（EMBED_ENDPOINT 为空即关闭语义检索）
          EMBED_ENDPOINT: ${{ vars.EMBED_ENDPOINT }}
        run: python scripts/generate_site.py

      - name: 📤 提交更新
        run: |
          git config user.name "Fishery Bot 🤖"
          git config user.email "fishery-bot@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "📰 渔业文献每日更新 - $(date -u +'%Y-%m-%d')"
            git push
          fi
